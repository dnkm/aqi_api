services:
  - type: web
    name: aqi-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: best_model.pth
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173
